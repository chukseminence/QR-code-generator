<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/generator.css">
    <link rel="stylesheet" href="/scanner.css">
     <!--link font awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>

    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <!--link css-->
    <title>Document</title>
</head>
<body>
<div class="container">
    <nav>
        <button class="nav-gene active">Generator</button>
        <button class="nav-scan">Scanner</button>
    </nav>

    <div class="generator" >
        <h1>QR Code Generator</h1>
        <p>Paste a url or enter text to create QR code</p>

        <div class="generator-form">
            <input type="text" placeholder="Enter text or url">
            <button>Generate QR Code</button>
        </div>

        <div class="generator-img">
            <img class="qr" src="/My_QR_Code_2-1024.jpeg" alt="">
        </div>

        <div class="generator-btn">
            <button class="btn-link">Download <i class="fa-solid fa-download"></i></button>
        </div>
    </div>

    <div class="scanner" id="scan" style="display: none;">
        <h1>
            QR Code Scanner or Reader
            <i class="fa-solid fa-camera"></i>
            <i class="fa-solid fa-circle-stop"></i>

        </h1>
        <form class="scanner-form">

            <input type="file" accept="image/*"  >
            <img class="qr" src="./My_QR_Code_2-1024.jpeg" alt="qr-code">

            <video></video>

            <div class="content">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p>Upload QR Code to Scan</p>
            </div>

        </form>

        <div class="scanner-details">
            <textarea disabled>https://www.facebook.com</textarea>

            <div class="btn">
                <button class="close">Close</button>
                <button class="copy">Copy</button>
            </div>
        </div>
    </div>
</div>

    

    <script src="/script.js" ></script>
    <script src="/generator.js"></script>
    <script src="/scanner.js"></script>
    <script src="/instascan.min.js"></script>
</body>
</html>
